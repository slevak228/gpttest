name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: >-
          python -m py_compile
          autograd.py primitives.py tokenizer.py embedding.py gpt.py
          config.py optimizer.py training.py pipeline.py main.py

      - name: Import check
        run: python -c "import main, pipeline, training"
